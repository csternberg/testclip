[project]
name = "testclip"
version = "0.1.0"
description = "Generate synthetic test video clips (patterns, resolutions, codecs, synthetic audio) via ffmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
testclip = "testclip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["testclip*"]
